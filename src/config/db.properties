# MySQL Configuration
db.url=jdbc:mysql://14.225.192.94:3306/zentechStockManagement?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user=admin
db.password=Zentech@123

# Connection Pool Configuration
db.pool.maxSize=20
db.pool.minIdle=10
db.pool.connectionTimeout=30000
db.pool.idleTimeout=300000
db.pool.maxLifetime=1800000
db.pool.leakDetectionThreshold=5000

# SSL/TLS Configuration
# Enable SSL (true cho production, false cho development local)
db.ssl.enabled=true

# SSL Mode Options:
# - DISABLED: Kh\u00f4ng d\u00f9ng SSL
# - PREFERRED: D\u00f9ng SSL n\u1ebfu server h\u1ed7 tr\u1ee3
# - REQUIRED: B\u1eaft bu\u1ed9c SSL nh\u01b0ng kh\u00f4ng verify certificate (d\u00f9ng c\u00e1i n\u00e0y l\u00e0 \u0111\u1ee7)
# - VERIFY_CA: B\u1eaft bu\u1ed9c SSL v\u00e0 verify CA certificate
# - VERIFY_IDENTITY: B\u1eaft bu\u1ed9c SSL, verify CA v\u00e0 hostname
db.ssl.mode=REQUIRED

db.ssl.tlsVersions=TLSv1.2,TLSv1.3

# Verify connection s\u1eed d\u1ee5ng test query
db.ssl.verifyConnection=true


